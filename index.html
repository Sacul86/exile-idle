<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0d0b09">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Exile Idle: Party of Legends</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Fontin+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="hud">
    <div class="hud-row">
      <div class="lvl">Lv <b id="hud-level">1</b></div>
      <div class="bar xp"><div id="hud-xp" class="fill"></div><span id="hud-xp-text"></span></div>
    </div>
    <div class="hud-row currencies">
      <span>🪙 <b id="hud-gold">0</b></span>
      <span>💠 <b id="hud-shards">0</b></span>
      <span>🏅 <b id="hud-emblems">0</b></span>
      <span>⚡ <b id="hud-power">0</b></span>
    </div>
  </header>

  <main id="view"></main>

  <nav id="tabs">
    <button data-tab="battle" class="active"><span>⚔️</span>Battle</button>
    <button data-tab="heroes"><span>🛡️</span>Heroes<i id="tree-badge"></i></button>
    <button data-tab="bag"><span>🎒</span>Bag<i id="bag-badge"></i></button>
    <button data-tab="pets"><span>🐾</span>Pets<i id="pet-badge"></i></button>
    <button data-tab="events"><span>🏰</span>Events<i id="end-badge"></i></button>
    <button data-tab="more"><span>📜</span>Stats</button>
  </nav>

  <div id="modal" class="hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toasts"></div>

  <script type="module" src="js/main.js?v=20261123d"></script>
</body>
</html>
