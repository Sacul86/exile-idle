name: Build art
on:
  push:
    paths: ['art/sources.json', 'tools/art_pipeline.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python tools/art_pipeline.py
      - name: Commit art
        run: |
          git config user.name "art-bot"
          git config user.email "art-bot@users.noreply.github.com"
          git add assets art/raw
          git diff --cached --quiet || git commit -m "Build art assets [skip ci]"
          git push
